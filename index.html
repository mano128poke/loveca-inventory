<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ラブカ コレクション管理</title>

<link rel="manifest" href="manifest.json">

<style>
*{
  box-sizing:border-box;
}

body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  margin:0;
  background:#f7f7f9;
  color:#222;
}

header{
  background:#fff;
  padding:16px;
  border-bottom:1px solid #ddd;
  position:sticky;
  top:0;
  z-index:10;
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:12px;
}

h1{
  font-size:20px;
  margin:0 0 6px;
}

.status{
  font-size:13px;
  color:#666;
}

/* 統計 */

.stats{
  background:#fff;
  border-radius:12px;
  padding:14px;
  margin:10px 0;
}

.stat-main{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.stat-number{
  font-size:18px;
  font-weight:bold;
}

.stat-percent{
  font-size:14px;
  color:#666;
}

.stat-detail{
  margin-top:8px;
  font-size:13px;
  color:#555;
}

.bar{
  height:10px;
  background:#eee;
  border-radius:9px;
  overflow:hidden;
  margin-top:10px;
}

.bar i{
  display:block;
  height:100%;
  background:#555;
  width:0%;
  transition:width .2s;
}

/* 検索 */

input,
select,
button{
  font:inherit;
  padding:9px;
  border:1px solid #ccc;
  border-radius:8px;
  background:#fff;
}

input{
  width:100%;
  margin:8px 0;
}

.filters{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:8px;
}

.filters select{
  width:100%;
}

/* 追加フィルター */

.extra-filters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:8px 0;
}

.filter-button{
  cursor:pointer;
}

.filter-button.active{
  background:#555;
  color:#fff;
  border-color:#555;
}

/* 件数 */

.result-info{
  font-size:13px;
  color:#666;
  margin:10px 2px;
}

/* カード */

.card{
  background:#fff;
  border-radius:12px;
  padding:12px;
  margin:10px 0;
  display:flex;
  gap:12px;
  align-items:center;
}

.card-image{
  width:72px;
  height:100px;
  flex-shrink:0;
  object-fit:contain;
  background:#f2f2f2;
  border-radius:6px;
}

.card-image.no-image{
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  color:#999;
}

.card-info{
  flex:1;
  min-width:0;
}

.card-name{
  font-weight:bold;
  word-break:break-word;
}

.meta{
  font-size:12px;
  color:#666;
  margin-top:4px;
  line-height:1.5;
}

.work{
  display:inline-block;
  background:#eee;
  border-radius:5px;
  padding:2px 5px;
  margin-right:3px;
}

.qty{
  display:flex;
  align-items:center;
  gap:6px;
  flex-shrink:0;
}

.qty button{
  width:36px;
  height:36px;
  padding:0;
  font-size:20px;
  cursor:pointer;
}

.qty-number{
  min-width:28px;
  text-align:center;
  font-weight:bold;
}

/* 所持カード */

.card.owned{
  border-left:4px solid #555;
}

/* もっと読む */

.more{
  width:100%;
  margin:12px 0 30px;
  padding:12px;
  cursor:pointer;
}

/* 上へ */

.top-button{
  position:fixed;
  right:15px;
  bottom:15px;
  width:44px;
  height:44px;
  border-radius:50%;
  display:none;
  z-index:20;
  box-shadow:0 2px 8px #aaa;
}

/* スマホ */

@media(max-width:600px){

  .wrap{
    padding:8px;
  }

  header{
    padding:12px;
  }

  h1{
    font-size:18px;
  }

  .filters{
    grid-template-columns:1fr;
  }

  .card{
    padding:9px;
    gap:9px;
  }

  .card-image{
    width:60px;
    height:84px;
  }

  .card-name{
    font-size:14px;
  }

  .meta{
    font-size:11px;
  }

  .qty{
    gap:3px;
  }

  .qty button{
    width:32px;
    height:32px;
  }

  .qty-number{
    min-width:22px;
  }
}
</style>
</head>

<body>

<header>
  <div class="wrap">
    <h1>ラブカ コレクション管理</h1>
    <div id="status" class="status">
      カードデータを読み込み中…
    </div>
  </div>
</header>

<main class="wrap">

  <!-- 統計 -->

  <section class="stats">

    <div class="stat-main">
      <div>
        <div id="count" class="stat-number">
          0枚登録
        </div>

        <div id="pt" class="stat-detail">
          所持 0 / 0
        </div>
      </div>

      <div id="percent" class="stat-percent">
        0.0%
      </div>
    </div>

    <div id="totalOwned" class="stat-detail">
      総所持枚数：0枚
    </div>

    <div class="bar">
      <i id="pg"></i>
    </div>

  </section>


  <!-- 検索 -->

  <input
    id="q"
    placeholder="カード名・番号・商品名で検索"
    autocomplete="off"
  >


  <!-- 商品・レアリティ -->

  <div class="filters">

    <select id="product">
      <option value="">商品すべて</option>
    </select>

    <select id="rarity">
      <option value="">レアリティすべて</option>
    </select>

  </div>


  <!-- 作品・カード種別 -->

  <div class="extra-filters">

    <button
      class="filter-button active"
      data-work=""
    >
      全作品
    </button>

    <button
      class="filter-button"
      data-work="μ's"
    >
      μ's
    </button>

    <button
      class="filter-button"
      data-work="Aqours"
    >
      Aqours
    </button>

    <button
      class="filter-button"
      data-work="虹ヶ咲"
    >
      虹ヶ咲
    </button>

    <button
      class="filter-button"
      data-work="Liella!"
    >
      Liella!
    </button>

    <button
      class="filter-button"
      data-work="蓮ノ空"
    >
      蓮ノ空
    </button>

  </div>


  <div class="extra-filters">

    <button
      class="filter-button active"
      data-kind=""
    >
      全カード
    </button>

    <button
      class="filter-button"
      data-kind="member"
    >
      メンバーカード
    </button>

    <button
      class="filter-button"
      data-kind="live"
    >
      ライブカード
    </button>

  </div>


  <!-- 所持状態 -->

  <div class="extra-filters">

    <button
      class="filter-button active"
      data-owned=""
    >
      すべて
    </button>

    <button
      class="filter-button"
      data-owned="owned"
    >
      所持済み
    </button>

    <button
      class="filter-button"
      data-owned="missing"
    >
      未所持
    </button>

  </div>


  <div id="resultInfo" class="result-info">
    0件
  </div>


  <!-- カード一覧 -->

  <div id="list"></div>

  <button
    id="more"
    class="more"
    style="display:none"
  >
    もっと読み込む
  </button>

</main>


<button
  id="topButton"
  class="top-button"
  onclick="window.scrollTo({top:0,behavior:'smooth'})"
>
  ↑
</button>


<script>

const K = "loveca_inventory_v4";

let cards = [];

let inv = {};

try{
  inv = JSON.parse(
    localStorage.getItem(K) || "{}"
  );
}catch(e){
  inv = {};
}

let workFilter = "";
let kindFilter = "";
let ownedFilter = "";

let displayLimit = 100;

const $ = x =>
  document.getElementById(x);


/* --------------------------------
   HTMLエスケープ
-------------------------------- */

function esc(s){

  return String(s || "")
    .replace(/[&<>"]/g, c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;"
    }[c]));

}


/* --------------------------------
   在庫保存
-------------------------------- */

function save(){

  localStorage.setItem(
    K,
    JSON.stringify(inv)
  );

  render();

}


/* --------------------------------
   在庫変更
-------------------------------- */

function chg(id,n){

  inv[id] =
    Math.max(
      0,
      (inv[id] || 0) + n
    );

  save();

}


/* --------------------------------
   カード画像エラー
-------------------------------- */

function imageError(img){

  img.style.display = "none";

  const box =
    document.createElement("div");

  box.className =
    "card-image no-image";

  box.textContent =
    "画像なし";

  img.parentNode.insertBefore(
    box,
    img
  );

}


/* --------------------------------
   カード一覧表示
-------------------------------- */

function render(){

  const q =
    $("q").value
      .trim()
      .toLowerCase();

  const p =
    $("product").value;

  const r =
    $("rarity").value;


  let result =
    cards.filter(c => {

      const searchText = [
        c.id,
        c.name,
        c.product,
        c.school,
        c.unit,
        c.work
      ]
      .join(" ")
      .toLowerCase();


      if(
        q &&
        !searchText.includes(q)
      ){
        return false;
      }


      if(
        p &&
        c.product !== p
      ){
        return false;
      }


      if(
        r &&
        c.rarity !== r
      ){
        return false;
      }


      if(
        workFilter &&
        c.work !== workFilter
      ){
        return false;
      }


      if(
        kindFilter &&
        c.kind !== kindFilter
      ){
        return false;
      }


      const quantity =
        inv[c.id] || 0;


      if(
        ownedFilter === "owned" &&
        quantity <= 0
      ){
        return false;
      }


      if(
        ownedFilter === "missing" &&
        quantity > 0
      ){
        return false;
      }


      return true;

    });


  /* --------------------------------
     統計
  -------------------------------- */

  const ownedCards =
    cards.reduce(
      (n,c) =>
        n + (
          (inv[c.id] || 0) > 0
            ? 1
            : 0
        ),
      0
    );


  const totalOwned =
    cards.reduce(
      (n,c) =>
        n + (inv[c.id] || 0),
      0
    );


  const total =
    cards.length;


  const percent =
    total
      ? ownedCards / total * 100
      : 0;


  $("count").textContent =
    total.toLocaleString() +
    "枚登録";


  $("pt").textContent =
    `所持 ${ownedCards.toLocaleString()} / ${total.toLocaleString()} 枚`;


  $("percent").textContent =
    percent.toFixed(1) + "%";


  $("totalOwned").textContent =
    `総所持枚数：${totalOwned.toLocaleString()}枚`;


  $("pg").style.width =
    Math.min(100,percent) + "%";


  $("resultInfo").textContent =
    `${result.length.toLocaleString()}件中 ` +
    `${Math.min(displayLimit,result.length).toLocaleString()}件を表示`;


  /* --------------------------------
     カード一覧
  -------------------------------- */

  const visible =
    result.slice(
      0,
      displayLimit
    );


  $("list").innerHTML =
    visible.map(c => {

      const quantity =
        inv[c.id] || 0;


      const ownedClass =
        quantity > 0
          ? " owned"
          : "";


      return `

        <div class="card${ownedClass}">

          ${
            c.image
              ? `
                <img
                  class="card-image"
                  src="${esc(c.image)}"
                  loading="lazy"
                  onerror="imageError(this)"
                >
              `
              : `
                <div class="card-image no-image">
                  画像なし
                </div>
              `
          }


          <div class="card-info">

            <div class="card-name">
              ${esc(c.name || "カード名不明")}
            </div>

            <div class="meta">

              <span class="work">
                ${esc(c.work || "その他")}
              </span>

              ${
                c.kind === "member"
                  ? "メンバー"
                  : c.kind === "live"
                    ? "ライブ"
                    : ""
              }

              <br>

              ${esc(c.id)}

              <br>

              ${esc(c.product || "商品情報なし")}

              ${
                c.rarity
                  ? `<br>${esc(c.rarity)}`
                  : ""
              }

            </div>

          </div>


          <div class="qty">

            <button
              onclick="chg('${esc(c.id)}',-1)"
              aria-label="減らす"
            >
              −
            </button>

            <span class="qty-number">
              ${quantity}
            </span>

            <button
              onclick="chg('${esc(c.id)}',1)"
              aria-label="増やす"
            >
              ＋
            </button>

          </div>

        </div>

      `;

    }).join("");


  /* --------------------------------
     もっと読む
  -------------------------------- */

  if(
    displayLimit <
    result.length
  ){

    $("more").style.display =
      "block";

  }else{

    $("more").style.display =
      "none";

  }

}


/* --------------------------------
   もっと読み込む
-------------------------------- */

$("more").onclick = function(){

  displayLimit += 100;

  render();

};


/* --------------------------------
   商品・レアリティ
-------------------------------- */

$("product").onchange =
  function(){

    displayLimit = 100;

    render();

  };


$("rarity").onchange =
  function(){

    displayLimit = 100;

    render();

  };


/* --------------------------------
   検索
-------------------------------- */

$("q").oninput =
  function(){

    displayLimit = 100;

    render();

  };


/* --------------------------------
   作品フィルター
-------------------------------- */

document
  .querySelectorAll(
    "[data-work]"
  )
  .forEach(button => {

    button.onclick =
      function(){

        workFilter =
          this.dataset.work;

        document
          .querySelectorAll(
            "[data-work]"
          )
          .forEach(x =>
            x.classList.remove(
              "active"
            )
          );

        this.classList.add(
          "active"
        );

        displayLimit = 100;

        render();

      };

  });


/* --------------------------------
   カード種別
-------------------------------- */

document
  .querySelectorAll(
    "[data-kind]"
  )
  .forEach(button => {

    button.onclick =
      function(){

        kindFilter =
          this.dataset.kind;

        document
          .querySelectorAll(
            "[data-kind]"
          )
          .forEach(x =>
            x.classList.remove(
              "active"
            )
          );

        this.classList.add(
          "active"
        );

        displayLimit = 100;

        render();

      };

  });


/* --------------------------------
   所持状態
-------------------------------- */

document
  .querySelectorAll(
    "[data-owned]"
  )
  .forEach(button => {

    button.onclick =
      function(){

        ownedFilter =
          this.dataset.owned;

        document
          .querySelectorAll(
            "[data-owned]"
          )
          .forEach(x =>
            x.classList.remove(
              "active"
            )
          );

        this.classList.add(
          "active"
        );

        displayLimit = 100;

        render();

      };

  });


/* --------------------------------
   スクロール時の↑ボタン
-------------------------------- */

window.addEventListener(
  "scroll",
  function(){

    $("topButton").style.display =
      window.scrollY > 400
        ? "block"
        : "none";

  }
);


/* --------------------------------
   データ読み込み
-------------------------------- */

async function load(){

  try{

    const r =
      await fetch(
        "data/cards.json?" +
        Date.now()
      );


    if(!r.ok){

      throw new Error(
        "HTTP " + r.status
      );

    }


    cards =
      await r.json();


    if(!Array.isArray(cards)){

      throw new Error(
        "cards.jsonが配列ではありません"
      );

    }


    /* 商品 */

    const products =
      [
        ...new Set(
          cards
            .map(c => c.product)
            .filter(Boolean)
        )
      ].sort();


    products.forEach(x => {

      $("product")
        .insertAdjacentHTML(
          "beforeend",
          `<option value="${esc(x)}">${esc(x)}</option>`
        );

    });


    /* レアリティ */

    const rarities =
      [
        ...new Set(
          cards
            .map(c => c.rarity)
            .filter(Boolean)
        )
      ].sort();


    rarities.forEach(x => {

      $("rarity")
        .insertAdjacentHTML(
          "beforeend",
          `<option value="${esc(x)}">${esc(x)}</option>`
        );

    });


    $("status").textContent =
      "カードデータ同期済み：" +
      cards.length.toLocaleString() +
      "件";


    render();


  }catch(e){

    console.error(e);

    $("status").textContent =
      "カードデータを読み込めませんでした。GitHub Actionsとdata/cards.jsonを確認してください。";

  }

}


/* --------------------------------
   起動
-------------------------------- */

load();

</script>

</body>
</html>
