<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ラブカ コレクション管理</title><link rel="manifest" href="manifest.json"><style>body{font-family:system-ui;margin:0;background:#f7f7f9;color:#222}header{background:#fff;padding:16px;border-bottom:1px solid #ddd}.wrap{max-width:900px;margin:auto;padding:12px}.stats,.card{background:#fff;border-radius:12px;padding:12px;margin:10px 0}.bar{height:10px;background:#eee;border-radius:9px}.bar i{display:block;height:100%;background:#555}.card{display:flex;gap:12px;align-items:center}.card img{width:72px;height:100px;object-fit:contain}.qty{margin-left:auto;display:flex;gap:6px}.qty button{width:36px}input,select,button{font:inherit;padding:9px;border:1px solid #ccc;border-radius:8px}input{width:100%;box-sizing:border-box;margin:8px 0}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.meta{font-size:12px;color:#666}h1{font-size:20px;margin:0 0 6px}</style></head><body><header><div class="wrap"><h1>ラブカ コレクション管理</h1><div id="status">公式カードデータを読み込み中…</div></div></header><main class="wrap"><section class="stats"><b id="count">0枚</b><div id="pt"></div><div class="bar"><i id="pg" style="width:0%"></i></div></section><input id="q" placeholder="カード名・番号・商品名で検索"><div class="filters"><select id="product"><option value="">商品すべて</option></select><select id="rarity"><option value="">レアリティすべて</option></select></div><div id="list"></div></main><script>const K="loveca_inventory_v4";let cards=[],inv=JSON.parse(localStorage.getItem(K)||"{}");const $=x=>document.getElementById(x);function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}function save(){localStorage.setItem(K,JSON.stringify(inv));render()}function chg(id,n){inv[id]=Math.max(0,(inv[id]||0)+n);save()}function render(){let q=$("q").value.toLowerCase(),p=$("product").value,r=$("rarity").value;let a=cards.filter(c=>(!q||[c.id,c.name,c.product,c.school,c.unit].join(" ").toLowerCase().includes(q))&&(!p||c.product===p)&&(!r||c.rarity===r));$("count").textContent=cards.length.toLocaleString()+"枚登録";let owned=cards.reduce((n,c)=>n+Math.min(inv[c.id]||0,c.required||1),0),need=cards.length,pc=need?owned/need*100:0;$("pt").textContent=`所持 ${owned.toLocaleString()} / ${need.toLocaleString()}（${pc.toFixed(1)}%）`;$("pg").style.width=Math.min(100,pc)+"%";$("list").innerHTML=a.slice(0,300).map(c=>`<div class="card"><img src="${esc(c.image)}" onerror="this.style.visibility='hidden'"><div style="flex:1"><b>${esc(c.name)}</b><div class="meta">${esc(c.id)}<br>${esc(c.product)} / ${esc(c.rarity)}</div></div><div class="qty"><button onclick="chg('${esc(c.id)}',-1)">−</button><b>${inv[c.id]||0}</b><button onclick="chg('${esc(c.id)}',1)">＋</button></div></div>`).join("")||"<p>該当カードなし</p>"}async function load(){try{let r=await fetch("data/cards.json?"+Date.now());if(!r.ok)throw 0;cards=await r.json();let ps=[...new Set(cards.map(c=>c.product).filter(Boolean))].sort(),rs=[...new Set(cards.map(c=>c.rarity).filter(Boolean))].sort();ps.forEach(x=>$("product").insertAdjacentHTML("beforeend",`<option>${esc(x)}</option>`));rs.forEach(x=>$("rarity").insertAdjacentHTML("beforeend",`<option>${esc(x)}</option>`));$("status").textContent="公式リスト同期データ："+cards.length.toLocaleString()+"件";render()}catch(e){$("status").textContent="カードデータ未同期：GitHub Actionsで同期してください"}}$("q").oninput=render;$("product").onchange=render;$("rarity").onchange=render;load();</script></body></html>
