<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ラブカ コレクション管理</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f5f7;
  color: #222;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Yu Gothic",
    sans-serif;
}

header {
  background: white;
  padding: 28px 16px 22px;
  border-bottom: 1px solid #ddd;
}

header h1 {
  margin: 0 0 12px;
  font-size: 28px;
}

#syncInfo {
  color: #666;
  font-size: 18px;
}

.container {
  max-width: 1000px;
  margin: 0 auto;
  padding: 16px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}

.stat {
  background: white;
  border-radius: 14px;
  padding: 14px;
  text-align: center;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}

.stat-label {
  font-size: 13px;
  color: #777;
}

.stat-value {
  margin-top: 5px;
  font-size: 22px;
  font-weight: bold;
}

.filters {
  background: white;
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 16px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}

.search {
  width: 100%;
  padding: 14px;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 16px;
  margin-bottom: 12px;
}

select {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 10px;
  background: white;
  font-size: 16px;
  margin-bottom: 10px;
}

.button-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.filter-button {
  padding: 12px 17px;
  border: 1px solid #ccc;
  border-radius: 10px;
  background: white;
  font-size: 16px;
  cursor: pointer;
}

.filter-button.active {
  background: #555;
  color: white;
  border-color: #555;
}

.result-info {
  color: #666;
  margin: 14px 4px;
  font-size: 16px;
}

.cards {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 16px;
  box-shadow: 0 1px 5px rgba(0,0,0,0.06);
}

.card-image-wrap {
  width: 115px;
  min-width: 115px;
  height: 160px;
  border-radius: 10px;
  overflow: hidden;
  background: #eee;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card-image {
  width: 100%;
  height: 100%;
  object-fit: contain;
  cursor: zoom-in;
  display: block;
}

.no-image {
  color: #999;
  font-size: 13px;
  text-align: center;
}

.card-info {
  flex: 1;
  min-width: 0;
}

.card-name {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 7px;
  word-break: break-word;
}

.card-meta {
  color: #666;
  font-size: 14px;
  line-height: 1.7;
}

.badge {
  display: inline-block;
  background: #eee;
  color: #555;
  border-radius: 8px;
  padding: 2px 7px;
  margin-right: 4px;
}

.inventory {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-left: auto;
}

.inventory button {
  width: 48px;
  height: 48px;
  border: 1px solid #ccc;
  background: white;
  border-radius: 10px;
  font-size: 28px;
  line-height: 1;
  cursor: pointer;
}

.inventory button:active {
  background: #eee;
}

.inventory-count {
  min-width: 25px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}

.more-button {
  width: 100%;
  margin-top: 16px;
  padding: 15px;
  border: 1px solid #ccc;
  border-radius: 12px;
  background: white;
  font-size: 16px;
  cursor: pointer;
}

.more-button:active {
  background: #eee;
}

/* =========================
   画像拡大モーダル
   ========================= */

.image-modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.image-modal.active {
  display: flex;
}

.image-modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.88);
}

.image-modal-content {
  position: relative;
  z-index: 1;
  max-width: 96vw;
  max-height: 94vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.image-modal-content img {
  display: block;
  max-width: 96vw;
  max-height: 90vh;
  width: auto;
  height: auto;
  object-fit: contain;
  border-radius: 8px;
  box-shadow: 0 4px 30px rgba(0,0,0,0.5);
}

.image-modal-close {
  position: absolute;
  top: -48px;
  right: 0;
  width: 42px;
  height: 42px;
  border: none;
  border-radius: 50%;
  background: white;
  color: #333;
  font-size: 30px;
  line-height: 42px;
  padding: 0;
  cursor: pointer;
}

@media (max-width: 700px) {

  header h1 {
    font-size: 25px;
  }

  .stats {
    grid-template-columns: repeat(2, 1fr);
  }

  .card {
    padding: 12px;
    gap: 12px;
  }

  .card-image-wrap {
    width: 90px;
    min-width: 90px;
    height: 125px;
  }

  .card-name {
    font-size: 17px;
  }

  .card-meta {
    font-size: 13px;
  }

  .inventory {
    gap: 5px;
  }

  .inventory button {
    width: 42px;
    height: 42px;
    font-size: 24px;
  }

  .inventory-count {
    font-size: 18px;
  }

  .image-modal {
    padding: 8px;
  }

  .image-modal-content img {
    max-width: 96vw;
    max-height: 88vh;
  }
}
</style>
</head>

<body>

<header>
  <h1>ラブカ コレクション管理</h1>
  <div id="syncInfo">
    カードデータ読み込み中...
  </div>
</header>

<div class="container">

  <div class="stats">
    <div class="stat">
      <div class="stat-label">登録カード</div>
      <div class="stat-value" id="totalCards">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">所持カード</div>
      <div class="stat-value" id="ownedCards">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">所持枚数</div>
      <div class="stat-value" id="ownedQuantity">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">収集率</div>
      <div class="stat-value" id="collectionRate">0%</div>
    </div>
  </div>

  <div class="filters">

    <input
      id="search"
      class="search"
      type="search"
      placeholder="カード番号・カード名・商品名で検索"
    >

    <select id="productFilter">
      <option value="">商品すべて</option>
    </select>

    <select id="rarityFilter">
      <option value="">レアリティすべて</option>
    </select>

    <div class="button-row">

      <button
        class="filter-button active"
        data-work=""
      >
        全作品
      </button>

      <button
        class="filter-button"
        data-work="μ's"
      >
        μ's
      </button>

      <button
        class="filter-button"
        data-work="Aqours"
      >
        Aqours
      </button>

      <button
        class="filter-button"
        data-work="虹ヶ咲"
      >
        虹ヶ咲
      </button>

      <button
        class="filter-button"
        data-work="Liella!"
      >
        Liella!
      </button>

      <button
        class="filter-button"
        data-work="蓮ノ空"
      >
        蓮ノ空
      </button>

    </div>

    <div class="button-row" style="margin-top:10px;">

      <button
        class="filter-button active"
        data-kind=""
      >
        全カード
      </button>

      <button
        class="filter-button"
        data-kind="member"
      >
        メンバーカード
      </button>

      <button
        class="filter-button"
        data-kind="live"
      >
        ライブカード
      </button>

    </div>

    <div class="button-row" style="margin-top:10px;">

      <button
        class="filter-button active"
        data-ownership="all"
      >
        すべて
      </button>

      <button
        class="filter-button"
        data-ownership="owned"
      >
        所持済み
      </button>

      <button
        class="filter-button"
        data-ownership="missing"
      >
        未所持
      </button>

    </div>

  </div>

  <div class="result-info" id="resultInfo">
    読み込み中...
  </div>

  <div id="cards" class="cards"></div>

  <button
    id="moreButton"
    class="more-button"
    style="display:none;"
  >
    もっと読み込む
  </button>

</div>


<!-- =========================
     画像拡大ウィンドウ
     ========================= -->

<div
  id="imageModal"
  class="image-modal"
>

  <div
    id="imageModalBackdrop"
    class="image-modal-backdrop"
  ></div>

  <div class="image-modal-content">

    <button
      id="imageModalClose"
      class="image-modal-close"
      type="button"
      aria-label="閉じる"
    >
      ×
    </button>

    <img
      id="imageModalImage"
      src=""
      alt=""
    >

  </div>

</div>


<script>

const DATA_URL =
  "data/cards.json?timestamp=" + Date.now();

const STORAGE_KEY =
  "loveca_inventory_v4";


let cards = [];

let inventory = {};

let currentWork = "";

let currentKind = "";

let currentOwnership = "all";

let displayCount = 100;


/* =========================
   データ読み込み
   ========================= */

async function loadCards() {

  try {

    const response =
      await fetch(DATA_URL);

    if (!response.ok) {
      throw new Error(
        "カードデータ取得失敗"
      );
    }

    cards =
      await response.json();

    loadInventory();

    document.getElementById(
      "syncInfo"
    ).textContent =
      "カードデータ同期済み：" +
      cards.length.toLocaleString() +
      "件";

    setupFilters();

    render();

  } catch (error) {

    console.error(error);

    document.getElementById(
      "syncInfo"
    ).textContent =
      "カードデータを読み込めませんでした";

  }

}


/* =========================
   所持データ
   ========================= */

function loadInventory() {

  try {

    inventory =
      JSON.parse(
        localStorage.getItem(
          STORAGE_KEY
        ) || "{}"
      );

  } catch {

    inventory = {};

  }

}


function saveInventory() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(inventory)
  );

}


/* =========================
   フィルター
   ========================= */

function setupFilters() {

  const products =
    [...new Set(
      cards
        .map(c => c.product)
        .filter(Boolean)
    )]
    .sort(
      (a, b) =>
        a.localeCompare(
          b,
          "ja"
        )
    );

  const productSelect =
    document.getElementById(
      "productFilter"
    );

  for (
    const product of products
  ) {

    const option =
      document.createElement(
        "option"
      );

    option.value =
      product;

    option.textContent =
      product;

    productSelect.appendChild(
      option
    );

  }


  const rarities =
    [...new Set(
      cards
        .map(c => c.rarity)
        .filter(Boolean)
    )]
    .sort();

  const raritySelect =
    document.getElementById(
      "rarityFilter"
    );

  for (
    const rarity of rarities
  ) {

    const option =
      document.createElement(
        "option"
      );

    option.value =
      rarity;

    option.textContent =
      rarity;

    raritySelect.appendChild(
      option
    );

  }


  document
    .getElementById("search")
    .addEventListener(
      "input",
      () => {
        displayCount = 100;
        render();
      }
    );


  productSelect.addEventListener(
    "change",
    () => {
      displayCount = 100;
      render();
    }
  );


  raritySelect.addEventListener(
    "change",
    () => {
      displayCount = 100;
      render();
    }
  );


  document
    .querySelectorAll(
      "[data-work]"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          currentWork =
            button.dataset.work;

          document
            .querySelectorAll(
              "[data-work]"
            )
            .forEach(
              b =>
                b.classList.remove(
                  "active"
                )
            );

          button.classList.add(
            "active"
          );

          displayCount = 100;

          render();

        }
      );

    });


  document
    .querySelectorAll(
      "[data-kind]"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          currentKind =
            button.dataset.kind;

          document
            .querySelectorAll(
              "[data-kind]"
            )
            .forEach(
              b =>
                b.classList.remove(
                  "active"
                )
            );

          button.classList.add(
            "active"
          );

          displayCount = 100;

          render();

        }
      );

    });


  document
    .querySelectorAll(
      "[data-ownership]"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          currentOwnership =
            button.dataset.ownership;

          document
            .querySelectorAll(
              "[data-ownership]"
            )
            .forEach(
              b =>
                b.classList.remove(
                  "active"
                )
            );

          button.classList.add(
            "active"
          );

          displayCount = 100;

          render();

        }
      );

    });


  document
    .getElementById("moreButton")
    .addEventListener(
      "click",
      () => {

        displayCount += 100;

        render();

      }
    );

}


/* =========================
   カード絞り込み
   ========================= */

function getFilteredCards() {

  const search =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();

  const product =
    document
      .getElementById(
        "productFilter"
      )
      .value;

  const rarity =
    document
      .getElementById(
        "rarityFilter"
      )
      .value;


  return cards.filter(card => {

    if (
      currentWork &&
      card.work !== currentWork
    ) {
      return false;
    }


    if (
      currentKind &&
      card.kind !== currentKind
    ) {
      return false;
    }


    if (
      product &&
      card.product !== product
    ) {
      return false;
    }


    if (
      rarity &&
      card.rarity !== rarity
    ) {
      return false;
    }


    const count =
      Number(
        inventory[card.id] || 0
      );


    if (
      currentOwnership ===
      "owned" &&
      count <= 0
    ) {
      return false;
    }


    if (
      currentOwnership ===
      "missing" &&
      count > 0
    ) {
      return false;
    }


    if (search) {

      const target = [

        card.id,

        card.name,

        card.product,

        card.work,

        card.unit,

        card.school,

        card.rarity

      ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();


      if (
        !target.includes(search)
      ) {
        return false;
      }

    }


    return true;

  });

}


/* =========================
   カード表示
   ========================= */

function render() {

  const filtered =
    getFilteredCards();


  const display =
    filtered.slice(
      0,
      displayCount
    );


  const container =
    document.getElementById(
      "cards"
    );

  container.innerHTML = "";


  for (
    const card of display
  ) {

    const element =
      document.createElement(
        "div"
      );

    element.className =
      "card";


    const count =
      Number(
        inventory[card.id] || 0
      );


    let imageHTML;


    if (card.image) {

      imageHTML = `
        <img
          class="card-image"
          src="${escapeHTML(card.image)}"
          alt="${escapeHTML(card.name || "")}"
          loading="lazy"
          data-image="${escapeHTML(card.image)}"
        >
      `;

    } else {

      imageHTML = `
        <div class="no-image">
          画像なし
        </div>
      `;

    }


    let kindText =
      "";

    if (
      card.kind ===
      "member"
    ) {

      kindText =
        "メンバー";

    } else if (
      card.kind ===
      "live"
    ) {

      kindText =
        "ライブ";

    } else {

      kindText =
        card.kind || "";

    }


    element.innerHTML = `

      <div class="card-image-wrap">
        ${imageHTML}
      </div>

      <div class="card-info">

        <div class="card-name">
          ${escapeHTML(
            card.name || "名称不明"
          )}
        </div>

        <div class="card-meta">

          ${
            card.work
              ? `<span class="badge">
                   ${escapeHTML(card.work)}
                 </span>`
              : ""
          }

          ${
            kindText
              ? `<span class="badge">
                   ${escapeHTML(kindText)}
                 </span>`
              : ""
          }

          ${
            card.rarity
              ? `<span class="badge">
                   ${escapeHTML(card.rarity)}
                 </span>`
              : ""
          }

          <br>

          ${escapeHTML(
            card.id || ""
          )}

          <br>

          ${
            card.product
              ? escapeHTML(
                  card.product
                )
              : "商品情報なし"
          }

        </div>

      </div>

      <div class="inventory">

        <button
          type="button"
          class="minus-button"
          data-id="${escapeHTML(card.id)}"
        >
          −
        </button>

        <div class="inventory-count">
          ${count}
        </div>

        <button
          type="button"
          class="plus-button"
          data-id="${escapeHTML(card.id)}"
        >
          ＋
        </button>

      </div>

    `;


    container.appendChild(
      element
    );

  }


  container
    .querySelectorAll(
      ".minus-button"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          const id =
            button.dataset.id;

          const current =
            Number(
              inventory[id] || 0
            );

          if (
            current > 0
          ) {

            inventory[id] =
              current - 1;

          }

          saveInventory();

          render();

        }
      );

    });


  container
    .querySelectorAll(
      ".plus-button"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          const id =
            button.dataset.id;

          const current =
            Number(
              inventory[id] || 0
            );

          inventory[id] =
            current + 1;

          saveInventory();

          render();

        }
      );

    });


  updateStats();


  document.getElementById(
    "resultInfo"
  ).textContent =
    filtered.length.toLocaleString() +
    "件中 " +
    Math.min(
      displayCount,
      filtered.length
    ).toLocaleString() +
    "件を表示";


  const moreButton =
    document.getElementById(
      "moreButton"
    );


  if (
    displayCount <
    filtered.length
  ) {

    moreButton.style.display =
      "block";

    moreButton.textContent =
      "もっと読み込む";

  } else {

    moreButton.style.display =
      "none";

  }

}


/* =========================
   統計
   ========================= */

function updateStats() {

  const total =
    cards.length;


  let ownedCards =
    0;

  let ownedQuantity =
    0;


  for (
    const card of cards
  ) {

    const count =
      Number(
        inventory[card.id] || 0
      );


    if (
      count > 0
    ) {

      ownedCards++;

      ownedQuantity +=
        count;

    }

  }


  const rate =
    total > 0
      ? (
          ownedCards /
          total *
          100
        ).toFixed(1)
      : "0.0";


  document.getElementById(
    "totalCards"
  ).textContent =
    total.toLocaleString();


  document.getElementById(
    "ownedCards"
  ).textContent =
    ownedCards.toLocaleString();


  document.getElementById(
    "ownedQuantity"
  ).textContent =
    ownedQuantity.toLocaleString();


  document.getElementById(
    "collectionRate"
  ).textContent =
    rate + "%";

}


/* =========================
   HTMLエスケープ
   ========================= */

function escapeHTML(value) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   画像拡大
   ========================= */

const imageModal =
  document.getElementById(
    "imageModal"
  );

const imageModalImage =
  document.getElementById(
    "imageModalImage"
  );

const imageModalClose =
  document.getElementById(
    "imageModalClose"
  );

const imageModalBackdrop =
  document.getElementById(
    "imageModalBackdrop"
  );


function openImageModal(
  src,
  alt
) {

  imageModalImage.src =
    src;

  imageModalImage.alt =
    alt || "";

  imageModal.classList.add(
    "active"
  );

  document.body.style.overflow =
    "hidden";

}


function closeImageModal() {

  imageModal.classList.remove(
    "active"
  );

  imageModalImage.src =
    "";

  document.body.style.overflow =
    "";

}


/*
 * カード画像をタップ
 */
document.addEventListener(
  "click",
  event => {

    const image =
      event.target.closest(
        ".card-image"
      );

    if (!image) {
      return;
    }


    openImageModal(
      image.dataset.image ||
      image.src,
      image.alt
    );

  }
);


/*
 * ×ボタン
 */
imageModalClose.addEventListener(
  "click",
  closeImageModal
);


/*
 * 背景をタップ
 */
imageModalBackdrop.addEventListener(
  "click",
  closeImageModal
);


/*
 * Escキー
 */
